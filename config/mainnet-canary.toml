# Live chain profile: Base mainnet canary (chain id 8453). P3 (ADR-002).
#
# G5 CANARY CAPS: $50 max flash, $10 daily loss cap, 2 consecutive failures,
# operator float gas-only <= $20 equiv (ADR-002 §11). No live run happens in
# P3: this file exists so the L1/L2 lock and offline L10 suite cover canary.
#
# Role/executor placeholders (0x11../0x22..) are NOT deployed contracts: the
# P4 runbook replaces each with the verified canary address at deploy time,
# and startup refuses until the on-chain read-back matches (L4). Mainnet
# protocol addresses (Vault, routers, tokens, quoters, sequencer feed) are
# the pinned production values from docs/FREEZE.md.
#
# NEVER commit real RPC URLs with API keys here. `dry_run` stays true on
# disk: the live binary is armed only through the L1 lock, never by config.

dry_run = true
chain_id = 8453
rpc_ws_url = "ws://127.0.0.1:8545"
# Post-Denim default. Re-verify against docs.base.org before relying on it.
feed_mode = "canonical"
head_staleness_blocks = 5

# USDC base units (6 decimals). G5 canary: $50 / $5 / $10 / 2 failures.
max_flash_usdc = 50000000
min_net_profit_usdc = 5000000
max_slippage_bps = 50
daily_loss_cap_usdc = 10000000
max_consecutive_failures = 2
deadline_secs = 30
max_in_flight = 1

[[pairs]]
name = "WETH/USDC"
token_a = "0x4200000000000000000000000000000000000006"
token_b = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
decimals_a = 18
decimals_b = 6
enabled = true

[[pairs]]
name = "AERO/USDC"
token_a = "0x940181a94A35A4569E4529A3CDfB74e38FD98631"
token_b = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
decimals_a = 18
decimals_b = 6
